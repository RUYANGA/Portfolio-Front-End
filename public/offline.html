<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b100a" media="(prefers-color-scheme: dark)" />
    <title>Offline | Merci Ruyanga</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fbf7;
        --surface: #ffffff;
        --ink: #1b2216;
        --ink-2: #4e5549;
        --line: #dfe5db;
        --accent: #47790e;
        --accent-hover: #396600;
        --accent-ink: #ffffff;
        --accent-soft: #edf7e6;
        --accent-text: #3f6d0c;
        --shadow: 0 24px 48px -16px rgba(27, 34, 22, 0.18);
        --radius: 24px;
        --radius-sm: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0b100a;
          --surface: #131b11;
          --ink: #f1f5ee;
          --ink-2: #b9c2b3;
          --line: #222d1f;
          --accent: #8ecc5a;
          --accent-hover: #a6db78;
          --accent-ink: #0f1f05;
          --accent-soft: rgba(142, 204, 90, 0.11);
          --accent-text: #a6db78;
          --shadow: 0 24px 48px -16px rgba(0, 0, 0, 0.55);
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      .card {
        width: min(100%, 28rem);
        padding: clamp(1.25rem, 4vw, 2rem);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        text-align: center;
      }
      .icon {
        display: inline-grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 1rem;
        border-radius: 20px;
        background: var(--accent-soft);
        color: var(--accent-text);
      }
      .icon svg { width: 28px; height: 28px; }
      .eyebrow {
        margin: 0 0 0.5rem;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent-text);
      }
      h1 {
        margin: 0 0 0.625rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
        line-height: 1.15;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 auto;
        max-width: 32ch;
        color: var(--ink-2);
        font-size: 0.975rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 132px;
        padding: 0.625rem 1.125rem;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      }
      .button-primary { background: var(--accent); color: var(--accent-ink); }
      .button-primary:hover { background: var(--accent-hover); }
      .button-secondary { background: transparent; color: var(--ink); border-color: var(--line); }
      .button-secondary:hover { background: var(--accent-soft); }
      .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      @media (max-width: 420px) {
        .card { text-align: left; }
        .icon { margin-inline: 0; width: 56px; height: 56px; border-radius: 16px; }
        p { margin-inline: 0; max-width: none; }
        .actions { flex-direction: column; }
        .button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" />
          <path d="M8.5 16.4a5 5 0 0 1 7 0" />
          <path d="M5 12.9a10 10 0 0 1 5.2-2.7" />
          <path d="M19 12.9a10 10 0 0 0-2-1.5" />
          <path d="M2 8.8a15 15 0 0 1 4.2-2.6" />
          <path d="M22 8.8a15 15 0 0 0-11.3-3.8" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <p class="eyebrow">Connection lost</p>
      <h1>No internet connection</h1>
      <p>You&apos;re currently offline. Check your network connection and try again.</p>
      <div class="actions">
        <button class="button button-primary" type="button" onclick="window.location.reload()">Try again</button>
        <a class="button button-secondary" href="/">Go home</a>
      </div>
    </main>
  </body>
</html>
